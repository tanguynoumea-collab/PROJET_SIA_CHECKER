# Configuration sia-check — calée sur Treegram / L'Orée (voir docs/ifc-schema.md).
#
# categories : nomenclature. Arbre SIA 416 complet (chiffres entre parenthèses) :
#   children   : sous-catégories dont la somme doit égaler le parent ;
#   rule       : identifiant de la règle de sommation portée par ce parent ;
#   optional   : sous-catégorie rarement fournie ; son absence rend un résidu positif « implicite » ;
#   implicit_max_rel : résidu relatif max. toléré comme « implicite » (hypothèse projet, pas de valeur dans la SIA 416) ;
#   alias_of   : code normalisé vers un autre ; ignore : exclu des sommes sans être « inconnu » ;
#   absent_ok  : racine que la source ne fournit pas (ST) ; ses sous-catégories sans elle, ex. des abords SA
#                créés par une correction, ne sont pas un R4.
categories:
  # SIA 416 §2 — surface de plancher
  SP:   {family: sia, parent: null, children: [SN, SC], rule: R1}
  SN:   {family: sia, parent: SP, children: [SU, SD, SI], rule: R1}          # §2.1
  SU:   {family: sia, parent: SN, children: [SUP, SUS], rule: R2}           # §2.1.1
  SUP:  {family: sia, parent: SU}                                           # §2.1.1.1
  SUS:  {family: sia, parent: SU}                                           # §2.1.1.2
  SD:   {family: sia, parent: SN}                                           # §2.1.2
  SI:   {family: sia, parent: SN}                                           # §2.1.3
  SC:   {family: sia, parent: SP, children: [SCP, SCN], rule: R1, optional: true, implicit_max_rel: 0.20}  # §2.2
  SCP:  {family: sia, parent: SC}                                           # §2.2.1
  SCN:  {family: sia, parent: SC}                                           # §2.2.2
  # SIA 416 §3 — surface externe de plancher
  SEP:  {family: sia, parent: null, children: [SEN, SEC], rule: R3}
  SEN:  {family: sia, parent: SEP, children: [SEU, SED, SEI], rule: R3}     # §3.1
  SEU:  {family: sia, parent: SEN}                                          # §3.1.1
  SED:  {family: sia, parent: SEN}                                          # §3.1.2
  SEI:  {family: sia, parent: SEN}                                          # §3.1.3
  # SEC : comme SC, Treegram ne la crée pas (il la considère déduite) ; le résidu R3 des balcons et terrasses
  # (garde-corps, murets, bords de dalle) en est l'image. Seuil relevé sur L'Orée : 10 à 34 % de la SEP du niveau.
  SEC:  {family: sia, parent: SEP, children: [SECP, SECN], rule: R3, optional: true, implicit_max_rel: 0.35}  # §3.2
  SECP: {family: sia, parent: SEC}                                          # §3.2.1
  SECN: {family: sia, parent: SEC}                                          # §3.2.2
  # SIA 416 §1 — surface de terrain (absente de Treegram à ce jour)
  ST:   {family: sia, parent: null, children: [SB, SA], rule: R0, absent_ok: true}
  SB:   {family: sia, parent: ST}                                           # §1.1
  SA:   {family: sia, parent: ST, children: [SAA, SAN], rule: R0}           # §1.2
  SAA:  {family: sia, parent: SA}                                           # §1.2.1
  SAN:  {family: sia, parent: SA}                                           # §1.2.2
  # USPI 2014 — chaîne surfaces de vente PPE, par lot
  SNH:  {family: uspi}
  SH:   {family: uspi}
  SHA:  {family: uspi, alias_of: SH}
  SCI:  {family: uspi}
  MEM:  {family: uspi}
  SBH:  {family: uspi}
  SE:   {family: uspi}
  SVN:  {family: uspi}
  SVB:  {family: uspi}
  # Codes maison Treegram — sens déduit, à confirmer (docs/ifc-schema.md §3)
  SUT:  {family: custom}                 # rattaché à SU par la règle personnalisée P1 (voir custom_rules)
  SPT:  {family: custom, ignore: true}   # toitures (Type = Toiture)
  SFN:  {family: custom, ignore: true}   # façades
  SRV:  {family: custom, ignore: true}   # vitrages

# Libellés affichés (infobulles, rapports) : nom, référence, définition courte en paraphrase de la norme.
labels:
  SP:   {name: Surface de plancher, ref: SIA 416 §2, def: "Espaces accessibles fermés de toute part, surface de construction comprise. SP = SN + SC."}
  SN:   {name: Surface nette, ref: SIA 416 §2.1, def: "Partie de la SP délimitée par l'enveloppe et les éléments intérieurs. SN = SU + SD + SI."}
  SU:   {name: Surface utile, ref: SIA 416 §2.1.1, def: "Partie de la SN affectée à la destination du bâtiment au sens large. SU = SUP + SUS."}
  SUP:  {name: Surface utile principale, ref: SIA 416 §2.1.1.1, def: "Fonctions de la destination au sens strict : pièces de vie, chambres, bureaux, commerces…"}
  SUS:  {name: Surface utile secondaire, ref: SIA 416 §2.1.1.2, def: "Fonctions complétant la SUP : caves, buanderies, débarras, garages, abris PC, locaux poubelles."}
  SD:   {name: Surface de dégagement, ref: SIA 416 §2.1.2, def: "Accès exclusif aux surfaces utiles : couloirs hors appartements, halls, escaliers, rampes, gaines d'ascenseur."}
  SI:   {name: Surface d'installations, ref: SIA 416 §2.1.3, def: "Installations du bâtiment : locaux techniques, machineries, gaines techniques, réservoirs."}
  SC:   {name: Surface de construction, ref: SIA 416 §2.2, def: "Emprise horizontale des murs, cloisons, piliers, allèges dans la SP. Non fournie par Treegram : visible comme résidu R1."}
  SCP:  {name: Surface de construction porteuse, ref: SIA 416 §2.2.1}
  SCN:  {name: Surface de construction non porteuse, ref: SIA 416 §2.2.2}
  SEP:  {name: Surface externe de plancher, ref: SIA 416 §3, def: "Espaces extérieurs non fermés : balcons, terrasses, toitures-jardins, garages ouverts — sauf s'ils communiquent directement avec les abords (alors SA)."}
  SEN:  {name: Surface externe nette, ref: SIA 416 §3.1, def: "Partie utilisable de la SEP. SEN = SEU + SED + SEI."}
  SEU:  {name: Surface externe utile, ref: SIA 416 §3.1.1, def: "Balcons, terrasses et loggias utilisables."}
  SED:  {name: Surface externe de dégagement, ref: SIA 416 §3.1.2, def: "Coursives et circulations extérieures."}
  SEI:  {name: Surface externe d'installations, ref: SIA 416 §3.1.3}
  SEC:  {name: Surface externe de construction, ref: SIA 416 §3.2}
  ST:   {name: Surface de terrain, ref: SIA 416 §1}
  SB:   {name: Surface bâtie, ref: SIA 416 §1.1}
  SA:   {name: Surface des abords, ref: SIA 416 §1.2, def: "Partie du terrain non bâtie, y compris les dalles sur sous-sol aménagées en contact direct avec les abords."}
  SNH:  {name: Surface nette habitable, ref: USPI 2014}
  SH:   {name: Surface habitable, ref: USPI 2014, def: "SH = SNH + SCI (construction intérieure)."}
  SBH:  {name: Surface brute habitable, ref: USPI 2014, def: "SBH = SH + MEM (murs extérieurs et mitoyens)."}
  SVN:  {name: Surface de vente nette, ref: USPI 2014, def: "SVN = SH + SE (surfaces externes pondérées)."}
  SVB:  {name: Surface de vente brute, ref: USPI 2014, def: "SVB = SBH + SE."}
  SUT:  {name: Surface utile hors logement (catégorie Treegram), ref: règle personnalisée P1, def: "Catégorie ajoutée par Treegram à côté de SUP et SUS. Sur L'Orée : activités, commerces, bureaux, école, UAPE et leurs WC (docs/classification/L_OREE_SUT.md). Comptée dans la SU (SU = SUP + SUS + SUT)."}
  SPT:  {name: Toitures (code Treegram), ref: code maison, def: "Sens déduit du contenu (Type = Toiture). Ignoré dans les sommes."}
  SFN:  {name: Façades (code Treegram), ref: code maison}
  SRV:  {name: Vitrages (code Treegram), ref: code maison}

# Règles personnalisées : écarts assumés à la SIA 416, propres à la production Treegram.
# Chaque règle rattache des codes (adds) à un parent de l'arbre normatif ; le moteur les applique au
# chargement et les signale dans chaque message, rapport et export concerné. Retirer une règle
# revient à contrôler selon la norme stricte (le code redevient hors chaîne).
custom_rules:
  - id: P1
    title: "SU = SUP + SUS + SUT"
    parent: SU
    adds: [SUT]
    description: >
      Treegram découpe la surface utile en trois catégories au lieu de deux (SIA 416 §2.1.1) :
      SUP, SUS et SUT, cette dernière regroupant les usages hors logement (activités, commerces,
      bureaux, école, UAPE). SUT est donc compté dans la SU, au même rang que SUP et SUS, sans
      être reclassé dans l'une ou l'autre.

# Ratios informatifs du développement immobilier (SIA 416 et USPI), calculés par projet et par bâtiment.
# num / den : listes de codes additionnés (valeur effective : propre aire, sinon somme des enfants).
#   « SC » vaut SP − SN quand Treegram ne fournit pas la surface de construction ; « LOTS » = nombre de lots USPI.
# levels : all (défaut) ou above_ground (niveaux de rang ≥ 0, sans sous-sols).
# ref : fourchette de repère INDICATIVE (pratique courante en logement collectif suisse, pas une valeur normative) ;
#   à ajuster par type de projet. Un ratio hors repère n'est pas une erreur : c'est une question pour la revue IA.
ratios:
  - {id: SN/SP,   family: sia,  label: "Surface nette / surface de plancher", num: [SN], den: [SP], ref: [0.78, 0.88],
     note: "Complément de la part de construction : plus il est bas, plus murs et cloisons pèsent."}
  - {id: SC/SP,   family: sia,  label: "Part de construction (SP − SN)", num: [SC], den: [SP], ref: [0.12, 0.22],
     note: "SC n'est pas fournie par Treegram : calculée par différence, elle absorbe aussi les surfaces non classées."}
  - {id: SU/SP,   family: sia,  label: "Efficience utile (SU / SP)", num: [SU], den: [SP], ref: [0.62, 0.80]}
  - {id: SUP/SP,  family: sia,  label: "Part utile principale (SUP / SP)", num: [SUP], den: [SP], ref: [0.50, 0.72]}
  - {id: SUP/SU,  family: sia,  label: "Principale dans l'utile (SUP / SU)", num: [SUP], den: [SU], ref: [0.70, 0.95],
     note: "Sous la règle P1, SU comprend SUT : le ratio baisse sans que la SUP change."}
  - {id: SD/SP,   family: sia,  label: "Part de dégagement (SD / SP)", num: [SD], den: [SP], ref: [0.05, 0.12]}
  - {id: SI/SP,   family: sia,  label: "Part d'installations (SI / SP)", num: [SI], den: [SP], ref: [0.01, 0.05]}
  - {id: SEP/SP,  family: sia,  label: "Surface externe / plancher (SEP / SP)", num: [SEP], den: [SP], ref: [0.05, 0.20],
     note: "Gonflé si la SEP contient des abords ou des toitures."}
  - {id: SNH/SP,  family: uspi, label: "Habitable nette / plancher hors sous-sol", num: [SNH], den: [SP], levels: above_ground,
     ref: [0.55, 0.75], note: "Rendement de plan du logement ; baisse avec les usages non résidentiels (SUT)."}
  - {id: SH/SNH,  family: uspi, label: "Construction intérieure (SH / SNH)", num: [SH], den: [SNH], ref: [1.03, 1.08],
     note: "USPI 2014 : SCI ≈ 5 % de la SNH à défaut de précision."}
  - {id: SBH/SH,  family: uspi, label: "Murs extérieurs et mitoyens (SBH / SH)", num: [SBH], den: [SH], ref: [1.05, 1.15]}
  - {id: SVN/SP,  family: uspi, label: "Vendable net / plancher hors sous-sol", num: [SVN], den: [SP], levels: above_ground,
     ref: [0.60, 0.85], note: "Rendement commercial du projet (VD, FR, NE)."}
  - {id: SVB/SP,  family: uspi, label: "Vendable brut / plancher hors sous-sol", num: [SVB], den: [SP], levels: above_ground,
     ref: [0.70, 0.95], note: "Rendement commercial du projet (VS)."}
  - {id: SNH/lot, family: uspi, label: "Surface nette habitable moyenne par lot", num: [SNH], den: [LOTS], unit: m2,
     note: "Informatif : dépend du programme (typologies)."}

tolerance: {abs_m2: 0.5, rel: 0.005}

levels:
  ground: ['^N00$', '^RDC$', '^EG$', '^00$']   # regex sur le nom de niveau, pour A1
  technical: []                                # regex des niveaux exemptés de R5
  # Rang d'un niveau d'après son nom, quand la source ne donne pas d'altitude (A2).
  # rang = factor * (1er groupe capturé) + offset
  order:
    - {pattern: '^S(\d+)$', factor: -1}
    - {pattern: '^N(\d+)$', factor: 1}
    - {pattern: '(?i)^toit', offset: 1000}

# Correspondance source -> colonnes normalisées (reader.py)
# Tableau MDP HRS (mdp.py, propositions.py).
# affectation : Affectation proposée par type Treegram (liste « Affectation » du gabarit, feuille Listes formulaire).
# logement : types de pièces qui prennent « Logement general » dans un appartement (avec lot) ; les autres
#   (gaines, balcons…) gardent leur affectation. Une proposition refusée écrit « Inconnu ».
mdp:
  # Niveaux Treegram -> codes d'étage de la liste du gabarit MDP (Listes formulaire, Niveau)
  etages: {Toiture: TOI}
  logement: [Chambre, PieceDeVie, PieceSecondaire_2PointsEau, PieceSecondaire_3PointsEau, PieceSecondaire_4PointsEau,
             Distribution, CirculationH, SUS]
  affectation:
    Gaine: Gaines
    Local: Locaux techniques
    Ascenseur: Cage d'ascenseurs
    Escalier: Cage d'escaliers
    CirculationH: Distribution
    Distribution: Distribution
    CirculationExt: Distribution
    SUS: Abris/Caves
    Commerce: Commerce
    Balcon: Balcon
    Terrasse: Terrasse

sources:
  tgm:
    category_property: "Catégorie SIA"
    area_property: Area
    room_type_property: Type
    lot_property: ApartmentByTgm
    # bâtiment et niveau sont lus dans le préfixe du nom des surfaces élémentaires
    name_pattern: '^(?P<building>[^_]+)_(?P<level>[^_]+)_'
    lot_pattern: '^(?P<lot>[^_]+_[^_]+_Apart-\d+)_'
    # propriétés reprises telles quelles pour les exports (colonne : propriété Treegram)
    extra_properties: {perimeter: Perimeter, gross_height: GrossHeight, dx: DeltaX, dy: DeltaY, bedrooms: Bedrooms,
                       gross_area: GrossArea, net_area: NetArea, reservations_area: ReservationsArea}
    # totaux de niveau sans « Catégorie SIA » (nom : propriété qui les identifie), lus avec le nom pour code
    uncategorized_nodes: {SFN: NetArea}   # façade du niveau : surfaces brute, nette, vitrée (ReservationsArea)
  ifc:
    classes: [IfcSlab, IfcSpace, IfcBuildingElementProxy]
    category: {attribute: Name}            # ou {pset: ..., property: ...}
    area: {pset: Treegram, property: Area}
    lot: null                              # ex. {pset: ..., property: ...}
