[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-check"
version = "4.0.0"
description = "Contrôle par sommation des surfaces SIA 416 produites par Treegram"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "pandas",
    "openpyxl",
    "pyyaml",
    "jinja2",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest", "shapely"]
revue = ["shapely"]

[project.scripts]
sia-check = "sia_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sia_check = ["templates/*.j2", "templates/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
