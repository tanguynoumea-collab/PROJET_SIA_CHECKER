# Configuration sia-check — calée sur Treegram / L'Orée (voir docs/ifc-schema.md).
#
# categories : nomenclature. Arbre SIA 416 complet (chiffres entre parenthèses) :
#   children   : sous-catégories dont la somme doit égaler le parent ;
#   rule       : identifiant de la règle de sommation portée par ce parent ;
#   optional   : sous-catégorie rarement fournie ; son absence rend un résidu positif « implicite » ;
#   implicit_max_rel : résidu relatif max. toléré comme « implicite » (hypothèse projet, pas de valeur dans la SIA 416) ;
#   alias_of   : code normalisé vers un autre ; ignore : exclu des sommes sans être « inconnu » ;
#   absent_ok  : racine que la source ne fournit pas (ST) ; ses sous-catégories sans elle, ex. des abords SA
#                créés par une correction, ne sont pas un R4.
categories:
  # SIA 416 §2 — surface de plancher
  SP:   {family: sia, parent: null, children: [SN, SC], rule: R1}
  SN:   {family: sia, parent: SP, children: [SU, SD, SI], rule: R1}          # §2.1
  SU:   {family: sia, parent: SN, children: [SUP, SUS], rule: R2}           # §2.1.1
  SUP:  {family: sia, parent: SU}                                           # §2.1.1.1
  SUS:  {family: sia, parent: SU}                                           # §2.1.1.2
  SD:   {family: sia, parent: SN}                                           # §2.1.2
  SI:   {family: sia, parent: SN}                                           # §2.1.3
  SC:   {family: sia, parent: SP, children: [SCP, SCN], rule: R1, optional: true, implicit_max_rel: 0.20}  # §2.2
  SCP:  {family: sia, parent: SC}                                           # §2.2.1
  SCN:  {family: sia, parent: SC}                                           # §2.2.2
  # SIA 416 §3 — surface externe de plancher
  SEP:  {family: sia, parent: null, children: [SEN, SEC], rule: R3}
  SEN:  {family: sia, parent: SEP, children: [SEU, SED, SEI], rule: R3}     # §3.1
  SEU:  {family: sia, parent: SEN}                                          # §3.1.1
  SED:  {family: sia, parent: SEN}                                          # §3.1.2
  SEI:  {family: sia, parent: SEN}                                          # §3.1.3
  # SEC : comme SC, Treegram ne la crée pas (il la considère déduite) ; le résidu R3 des balcons et terrasses
  # (garde-corps, murets, bords de dalle) en est l'image. Seuil relevé sur L'Orée : 10 à 34 % de la SEP du niveau.
  SEC:  {family: sia, parent: SEP, children: [SECP, SECN], rule: R3, optional: true, implicit_max_rel: 0.35}  # §3.2
  SECP: {family: sia, parent: SEC}                                          # §3.2.1
  SECN: {family: sia, parent: SEC}                                          # §3.2.2
  # SIA 416 §1 — surface de terrain (absente de Treegram à ce jour)
  ST:   {family: sia, parent: null, children: [SB, SA], rule: R0, absent_ok: true}
  SB:   {family: sia, parent: ST}                                           # §1.1
  SA:   {family: sia, parent: ST, children: [SAA, SAN], rule: R0}           # §1.2
  SAA:  {family: sia, parent: SA}                                           # §1.2.1
  SAN:  {family: sia, parent: SA}                                           # §1.2.2
  # USPI 2014 — chaîne surfaces de vente PPE, par lot
  SNH:  {family: uspi}
  SH:   {family: uspi}
  SHA:  {family: uspi, alias_of: SH}
  SCI:  {family: uspi}
  MEM:  {family: uspi}
  SBH:  {family: uspi}
  SE:   {family: uspi}
  SVN:  {family: uspi}
  SVB:  {family: uspi}
  # Codes maison Treegram — sens déduit, à confirmer (docs/ifc-schema.md §3)
  SUT:  {family: custom}                 # rattaché à SU par la règle personnalisée P1 (voir custom_rules)
  SPT:  {family: custom, ignore: true}   # toitures (Type = Toiture)
  NC:   {family: custom, ignore: true}   # non comptabilisée : surface gardée mais hors sommes (toiture non accessible…)
  # Enveloppe (surfaces verticales, V3_PLAN §10) : totaux de niveau Treegram, hors des sommes horizontales ;
  # contrôlés par les règles E1–E5 (rules.envelope_checks) et repris dans les ratios d'enveloppe.
  SFN:  {family: enveloppe, ignore: true}   # façade du niveau : brute (aire), nette, réservations (ouvertures)
  SRV:  {family: enveloppe, ignore: true}   # vitrages : toutes les vitres du niveau

# Libellés affichés (infobulles, rapports) : nom, référence, définition courte en paraphrase de la norme.
labels:
  SP:   {name: Surface de plancher, ref: SIA 416 §2, def: "Espaces accessibles fermés de toute part, surface de construction comprise. SP = SN + SC."}
  SN:   {name: Surface nette, ref: SIA 416 §2.1, def: "Partie de la SP délimitée par l'enveloppe et les éléments intérieurs. SN = SU + SD + SI."}
  SU:   {name: Surface utile, ref: SIA 416 §2.1.1, def: "Partie de la SN affectée à la destination du bâtiment au sens large. SU = SUP + SUS."}
  SUP:  {name: Surface utile principale, ref: SIA 416 §2.1.1.1, def: "Fonctions de la destination au sens strict : pièces de vie, chambres, bureaux, commerces…"}
  SUS:  {name: Surface utile secondaire, ref: SIA 416 §2.1.1.2, def: "Fonctions complétant la SUP : caves, buanderies, débarras, garages, abris PC, locaux poubelles."}
  SD:   {name: Surface de dégagement, ref: SIA 416 §2.1.2, def: "Accès exclusif aux surfaces utiles : couloirs hors appartements, halls, escaliers, rampes, gaines d'ascenseur."}
  SI:   {name: Surface d'installations, ref: SIA 416 §2.1.3, def: "Installations du bâtiment : locaux techniques, machineries, gaines techniques, réservoirs."}
  SC:   {name: Surface de construction, ref: SIA 416 §2.2, def: "Emprise horizontale des murs, cloisons, piliers, allèges dans la SP. Non fournie par Treegram : visible comme résidu R1."}
  SCP:  {name: Surface de construction porteuse, ref: SIA 416 §2.2.1}
  SCN:  {name: Surface de construction non porteuse, ref: SIA 416 §2.2.2}
  SEP:  {name: Surface externe de plancher, ref: SIA 416 §3, def: "Espaces extérieurs non fermés : balcons, terrasses, toitures-jardins, garages ouverts — sauf s'ils communiquent directement avec les abords (alors SA)."}
  SEN:  {name: Surface externe nette, ref: SIA 416 §3.1, def: "Partie utilisable de la SEP. SEN = SEU + SED + SEI."}
  SEU:  {name: Surface externe utile, ref: SIA 416 §3.1.1, def: "Balcons, terrasses et loggias utilisables."}
  SED:  {name: Surface externe de dégagement, ref: SIA 416 §3.1.2, def: "Coursives et circulations extérieures."}
  SEI:  {name: Surface externe d'installations, ref: SIA 416 §3.1.3}
  SEC:  {name: Surface externe de construction, ref: SIA 416 §3.2}
  ST:   {name: Surface de terrain, ref: SIA 416 §1}
  SB:   {name: Surface bâtie, ref: SIA 416 §1.1}
  SA:   {name: Surface des abords, ref: SIA 416 §1.2, def: "Partie du terrain non bâtie, y compris les dalles sur sous-sol aménagées en contact direct avec les abords."}
  SNH:  {name: Surface nette habitable, ref: USPI 2014}
  SH:   {name: Surface habitable, ref: USPI 2014, def: "SH = SNH + SCI (construction intérieure)."}
  SBH:  {name: Surface brute habitable, ref: USPI 2014, def: "SBH = SH + MEM (murs extérieurs et mitoyens)."}
  SVN:  {name: Surface de vente nette, ref: USPI 2014, def: "SVN = SH + SE (surfaces externes pondérées)."}
  SVB:  {name: Surface de vente brute, ref: USPI 2014, def: "SVB = SBH + SE."}
  SUT:  {name: Surface utile hors logement (catégorie Treegram), ref: règle personnalisée P1, def: "Catégorie ajoutée par Treegram à côté de SUP et SUS. Sur L'Orée : activités, commerces, bureaux, école, UAPE et leurs WC (docs/classification/L_OREE_SUT.md). Comptée dans la SU (SU = SUP + SUS + SUT)."}
  SPT:  {name: Toitures (code Treegram), ref: code maison, def: "Sens déduit du contenu (Type = Toiture). Ignoré dans les sommes."}
  NC:   {name: Non comptabilisée, ref: correction, def: "Surface gardée dans le modèle mais hors des sommes SIA 416 et des exports (toiture non accessible, vide…). Choisie dans la visionneuse."}
  SFN:  {name: Façades (code Treegram), ref: code maison, def: "Surface verticale de la façade du niveau, brute (aire affichée) ; Treegram en donne aussi la part nette et les réservations (ouvertures). Hors des sommes SIA 416."}
  SRV:  {name: Vitrages (code Treegram), ref: code maison, def: "Surface de toutes les vitres du niveau (verticale). Surface vitrée des ratios d'enveloppe ; la surface pleine est la façade brute moins les vitrages."}

# Règles personnalisées : écarts assumés à la SIA 416, propres à la production Treegram.
# Chaque règle rattache des codes (adds) à un parent de l'arbre normatif ; le moteur les applique au
# chargement et les signale dans chaque message, rapport et export concerné. Retirer une règle
# revient à contrôler selon la norme stricte (le code redevient hors chaîne).
custom_rules:
  - id: P1
    title: "SU = SUP + SUS + SUT"
    parent: SU
    adds: [SUT]
    description: >
      Treegram découpe la surface utile en trois catégories au lieu de deux (SIA 416 §2.1.1) :
      SUP, SUS et SUT, cette dernière regroupant les usages hors logement (activités, commerces,
      bureaux, école, UAPE). SUT est donc compté dans la SU, au même rang que SUP et SUS, sans
      être reclassé dans l'une ou l'autre.

# Ratios informatifs du développement immobilier (SIA 416 et USPI), calculés par projet et par bâtiment.
# num / den : listes de codes additionnés (valeur effective : propre aire, sinon somme des enfants).
#   « SC » vaut SP − SN quand Treegram ne fournit pas la surface de construction ; « LOTS » = nombre de lots USPI.
# levels : all (défaut) ou above_ground (niveaux de rang ≥ 0, sans sous-sols).
# ref : fourchette de repère INDICATIVE (pratique courante en logement collectif suisse, pas une valeur normative) ;
#   à ajuster par type de projet. Un ratio hors repère n'est pas une erreur : c'est une question pour la revue IA.
ratios:
  - {id: SN/SP,   family: sia,  label: "Surface nette / surface de plancher", num: [SN], den: [SP], ref: [0.78, 0.88],
     note: "Complément de la part de construction : plus il est bas, plus murs et cloisons pèsent."}
  - {id: SC/SP,   family: sia,  label: "Part de construction (SP − SN)", num: [SC], den: [SP], ref: [0.12, 0.22],
     note: "SC n'est pas fournie par Treegram : calculée par différence, elle absorbe aussi les surfaces non classées."}
  - {id: SU/SP,   family: sia,  label: "Efficience utile (SU / SP)", num: [SU], den: [SP], ref: [0.62, 0.80]}
  # SUT : catégorie Treegram (activités, commerces, bureaux…) qui relève de la SUP au sens SIA 416 §2.1.1.1 ; elle reste
  # affichée à part (calques, bilan), mais les ratios de la SUP la comptent pour rester cohérents avec SU = SUP + SUS + SUT.
  - {id: SUP/SP,  family: sia,  label: "Part utile principale (SUP + SUT) / SP", num: [SUP, SUT], den: [SP], ref: [0.50, 0.72],
     note: "SUT (catégorie Treegram : activités, commerces, bureaux) comptée dans la SUP."}
  - {id: SUP/SU,  family: sia,  label: "Principale dans l'utile (SUP + SUT) / SU", num: [SUP, SUT], den: [SU], ref: [0.70, 0.95],
     note: "SUT (catégorie Treegram) comptée dans la SUP, comme dans la SU (règle P1)."}
  - {id: SD/SP,   family: sia,  label: "Part de dégagement (SD / SP)", num: [SD], den: [SP], ref: [0.05, 0.12]}
  - {id: SI/SP,   family: sia,  label: "Part d'installations (SI / SP)", num: [SI], den: [SP], ref: [0.01, 0.05]}
  - {id: SEP/SP,  family: sia,  label: "Surface externe / plancher (SEP / SP)", num: [SEP], den: [SP], ref: [0.05, 0.20],
     note: "Gonflé si la SEP contient des abords ou des toitures."}
  - {id: SNH/SP,  family: uspi, label: "Habitable nette / plancher hors sous-sol", num: [SNH], den: [SP], levels: above_ground,
     ref: [0.55, 0.75], note: "Rendement de plan du logement ; baisse avec les usages non résidentiels (SUT)."}
  - {id: SH/SNH,  family: uspi, label: "Construction intérieure (SH / SNH)", num: [SH], den: [SNH], ref: [1.03, 1.08],
     note: "USPI 2014 : SCI ≈ 5 % de la SNH à défaut de précision."}
  - {id: SBH/SH,  family: uspi, label: "Murs extérieurs et mitoyens (SBH / SH)", num: [SBH], den: [SH], ref: [1.05, 1.15]}
  - {id: SVN/SP,  family: uspi, label: "Vendable net / plancher hors sous-sol", num: [SVN], den: [SP], levels: above_ground,
     ref: [0.60, 0.85], note: "Rendement commercial du projet (VD, FR, NE)."}
  - {id: SVB/SP,  family: uspi, label: "Vendable brut / plancher hors sous-sol", num: [SVB], den: [SP], levels: above_ground,
     ref: [0.70, 0.95], note: "Rendement commercial du projet (VS)."}
  - {id: SNH/lot, family: uspi, label: "Surface nette habitable moyenne par lot", num: [SNH], den: [LOTS], unit: m2,
     note: "Informatif : dépend du programme (typologies)."}
  # Cages d'escalier (V3.1) : étages de logements seulement (SUP et lots), une cage = une surface SD de sous-type
  # escalier ; somme des étages desservis, soit la moyenne des étages pondérée par leurs cages
  - {id: SUP/cage, family: programme, label: "SUP par cage d'escalier et par étage de logements", num: [SUP_CAGES],
     den: [CAGES], unit: m2, note: "SUP (+ SUT) de l'étage / nombre de cages d'escalier de l'étage, sur les étages de logements."}
  - {id: log/cage, family: programme, label: "Logements par cage d'escalier et par étage", num: [LOG_CAGES], den: [CAGES],
     unit: nombre, note: "Lots de l'étage / cages de l'étage : combien de logements une cage dessert à chaque étage."}
  # Enveloppe (V3_PLAN §10) : surface vitrée = SRV, surface pleine = façade brute − SRV (jeton PLEINE)
  # Repères de vraisemblance tirés des projets de la base (27.10.2026), élargis : pas des cibles
  - {id: SRV/SFN, family: enveloppe, label: "Part vitrée (vitrages / façade brute)", num: [SRV], den: [SFN], levels: above_ground,
     ref: [0.20, 0.45], note: "Repère : projets de la base de données (21 à 42 %)."}
  - {id: SRV/PLEINE, family: enveloppe, label: "Surface vitrée / surface pleine", num: [SRV], den: [PLEINE], levels: above_ground,
     ref: [0.25, 0.80], note: "Surface pleine = façade brute − vitrages. Repère : projets de la base (26 à 74 %)."}
  - {id: SP/ENV, family: enveloppe, label: "Coefficient de forme : plancher hors-sol / enveloppe", num: [SP], den: [SFN, SPT],
     levels: above_ground, ref: [1.00, 1.30],
     note: "Enveloppe = façades hors-sol (SFN) + toitures (SPT). Plus haut = plus compact. Repère : projets de la base (1,03 à 1,25)."}
  - {id: SFN/SP, family: enveloppe, label: "Façade brute / plancher hors sous-sol", num: [SFN], den: [SP], levels: above_ground,
     ref: [0.50, 1.10], note: "Compacité : m² de façade par m² de plancher. Repère : projets de la base (0,60 à 1,08)."}

tolerance: {abs_m2: 0.5, rel: 0.005}

levels:
  ground: ['^N00$', '^RDC$', '^EG$', '^00$']   # regex sur le nom de niveau, pour A1
  technical: []                                # regex des niveaux exemptés de R5
  # Rang d'un niveau d'après son nom, quand la source ne donne pas d'altitude (A2).
  # rang = factor * (1er groupe capturé) + offset
  # Sous-sols : un S ou un « - » dans le nom (S01, SS1, S-1, 2SS, -1, N-1, Niveau -1, Parking -2), « Sous-sol »,
  # UG1 / U1 (Untergeschoss). Un nom inconnu reste hors-sol : ces formes sont donc reconnues explicitement.
  order:
    - {pattern: '(?i)^S{1,2}\s*-?\s*(\d+)$', factor: -1}
    - {pattern: '(?i)^(\d+)\s*S{1,2}$', factor: -1}
    - {pattern: '(?i)^UG?\s*(\d+)$', factor: -1}
    - {pattern: '(?i)^sous[- ]?sol\s*(\d+)$', factor: -1}
    - {pattern: '(?i)^sous[- ]?sol', offset: -1}
    - {pattern: '-\s*(\d+)\s*$', factor: -1}
    - {pattern: '^N(\d+)$', factor: 1}
    - {pattern: '(?i)^toit', offset: 1000}

# Correspondance source -> colonnes normalisées (reader.py)
# Tableau MDP HRS (mdp.py, propositions.py).
# affectation : Affectation proposée par type Treegram (liste « Affectation » du gabarit, feuille Listes formulaire).
# logement : types de pièces qui prennent « Logement general » dans un appartement (avec lot) ; les autres
#   (gaines, balcons…) gardent leur affectation. Une proposition refusée écrit « Inconnu ».
mdp:
  # Niveaux Treegram -> codes d'étage de la liste du gabarit MDP (Listes formulaire, Niveau)
  etages: {Toiture: TOI}
  logement: [Chambre, PieceDeVie, PieceSecondaire_2PointsEau, PieceSecondaire_3PointsEau, PieceSecondaire_4PointsEau,
             Distribution, CirculationH, SUS]
  affectation:
    Gaine: Gaines
    Local: Locaux techniques
    Ascenseur: Cage d'ascenseurs
    Escalier: Cage d'escaliers
    CirculationH: Distribution
    Distribution: Distribution
    CirculationExt: Distribution
    SUS: Abris/Caves
    Commerce: Commerce
    Balcon: Balcon
    Terrasse: Terrasse

sources:
  tgm:
    category_property: "Catégorie SIA"
    area_property: Area
    room_type_property: Type
    lot_property: ApartmentByTgm
    # bâtiment et niveau sont lus dans le préfixe du nom des surfaces élémentaires
    name_pattern: '^(?P<building>[^_]+)_(?P<level>[^_]+)_'
    lot_pattern: '^(?P<lot>[^_]+_[^_]+_Apart-\d+)_'
    # propriétés reprises telles quelles pour les exports (colonne : propriété Treegram)
    extra_properties: {perimeter: Perimeter, gross_height: GrossHeight, dx: DeltaX, dy: DeltaY, bedrooms: Bedrooms,
                       gross_area: GrossArea, net_area: NetArea, reservations_area: ReservationsArea}
    # totaux de niveau sans « Catégorie SIA » (nom : propriété qui les identifie), lus avec le nom pour code
    uncategorized_nodes: {SFN: NetArea}   # façade du niveau : surfaces brute, nette, vitrée (ReservationsArea)
    # totaux sans propriété distinctive, gardés seulement juste après un total donné : la SRV de l'arbre SIA suit
    # la SFN de son niveau ; d'autres SRV (arbre de quantités SFB2, SR, MIB…) n'appartiennent pas aux surfaces SIA
    following_nodes: {SRV: SFN}
  ifc:
    classes: [IfcSlab, IfcSpace, IfcBuildingElementProxy]
    category: {attribute: Name}            # ou {pset: ..., property: ...}
    area: {pset: Treegram, property: Area}
    lot: null                              # ex. {pset: ..., property: ...}

# Moteur de génération depuis l'IFC architecte (V4, docs/V4_PLAN.md) : sia-check --inventaire maquette.ifc
generation:
  ingest:
    # éléments lus avec leur géométrie, en plus des IfcSpace (sous-classes comprises)
    classes: [IfcWall, IfcCurtainWall, IfcSlab, IfcRoof, IfcDoor, IfcWindow, IfcStair, IfcRamp, IfcRailing, IfcColumn]
    threads: 0                 # 0 : tous les cœurs
  # Logement d'une pièce : propriété des IfcSpace (décision du 28.10.2026). Le motif garde la partie qui désigne
  # le logement : « 1A.01.02.01 » (bâtiment, étage, logement, pièce) -> « 1A.01.02 ».
  # Première propriété renseignée de la liste ; « scope: storey » : numéro valable dans son étage seulement ;
  # « with » : propriétés mises devant le numéro (La Bâtie : cage 26 ou 28, appartement 2 -> « 26-2 », le MDP
  # note « 26-202 »).
  lot:
    - {pset: Pset_HRS, property: NumeroPiece, pattern: '^(?P<lot>[^.]+\.[^.]+\.[^.]+)\.'}
    - {pset: Pset_SpaceOccupancyRequirements, property: Appartement, scope: storey,
       with: [Pset_SpaceOccupancyRequirements.CageEscalier]}   # La Bâtie : « 2 », « C » (communs)
  # Chaîne USPI par logement (generation/uspi.py, modèle Treegram relevé sur L'Orée)
  uspi:
    partition_m: 0.2           # cloison intérieure la plus épaisse : SHA = SNH + cloisons entre les SUP
    wall_max_m: 0.6            # mur extérieur le plus épais : SBH s'étend jusque-là, mitoyens partagés
    step_m: 0.05               # pas de croissance des logements dans les murs (partage des mitoyens)
    # contour brut de tout un niveau (Myonaz : « LOG », nom long « SBH », catégorie « Surface brute habitable
    # PPE ») : borne les logements à la place de la SP. Texte sans accents ni casse (nom, nom long, propriétés).
    sbh_contour: '(brute habitable|\bsbh\b)'
  audit:
    area_rel: 0.02             # aire déclarée (Qto) vs aire en plan : écart signalé au-delà de 2 %…
    area_abs: 0.5              # … et de 0,5 m²
    storey_gap_m: 1.0          # plancher d'un espace à plus de 1 m de l'altitude de son niveau : signalé
  # Nature et classement des espaces (generation/classify.py). Les textes sont comparés sans accents ni casse.
  # Ordre des sources, de la plus sûre à la moins sûre : code SIA écrit dans une propriété, catégorie SIA en
  # toutes lettres, code en préfixe du nom, dictionnaire des noms de pièces. Un espace sans source reste
  # « NONCLASSE » (code inconnu, listé par A3) pour l'analyse IA (phase 24) ou l'ajustement manuel.
  classify:
    unclassified: NONCLASSE
    # parties communes, pas un logement : « 1A.99.00 » (tout le bâtiment) ou « 1A.01.00 » (palier du niveau)
    common_lot: '(^[^.]+\.99\.|\.00$|(^|[/-])C$)'
    sia_codes: [SUP, SUS, SUT, SD, SI, SEU, SED, SEI, SEP, SP, SA, SPT]
    code_properties: ['SIA416', 'SIA 416', 'Catégorie SIA', 'CategorieSIA', 'SIA']   # nom de la propriété (fin de clé)
    category_property: Pset_SpaceCommon.Category
    # catégorie en toutes lettres -> code ; « nature » : pas une pièce intérieure. Motif cherché dans le texte
    # (« 416-SN-Surface utile principale » à La Bâtie), dans l'ordre : les extérieurs avant le reste.
    categories:
      '\bexternes?\b': {nature: exterieur}   # « Surface externe nette », « Surface de plancher externe »
      'surface de plancher': {nature: plancher}
      'surface de terrain': {nature: site}
      'surface des abords': {nature: site}
      'surface utile principale?': {code: SUP}
      'surface utile secondaire': {code: SUS}
      'surface de degagement': {code: SD}
      "surface d'installations?": {code: SI}
      'surface de construction': {nature: construction}
    predefined: {GFA: plancher}
    # contour : espace dont l'emprise couvre au moins deux autres espaces du niveau (logement dessiné en entier,
    # surface de plancher) ; il ne compte pas comme pièce
    container_min_children: 2
    container_cover: 0.9
    exterior_names: '\b(balcon|loggia|terrasse|coursive|jardin|attique ext|patio|preau|perron|toiture)\b'
    # Dictionnaire : premier motif qui correspond au nom long, sinon au nom. « where » : lot (dans un logement),
    # commun (hors logement), sinon partout.
    rooms:
      - {match: '\b(sejour|salon|living|cuisine|salle a manger|piece de vie|sej|cui|liv|sam)\b', code: SUP, type: PieceDeVie}
      - {match: '\b(chambre|chambre pr|ch|chs|chp)\b', code: SUP, type: Chambre}
      - {match: '\b(bureau)\b', where: lot, code: SUP, type: Chambre}
      - {match: '\b(salle de bains?|bain|sdb)\b', code: SUP, type: PieceSecondaire_4PointsEau}
      - {match: '\b(douche|salle d''eau|sdd|sde|wc ?/ ?d|wc d)\b', code: SUP, type: PieceSecondaire_3PointsEau}
      - {match: '\b(wc|toilettes?|lavabo|wcv)\b', where: lot, code: SUP, type: PieceSecondaire_2PointsEau}
      - {match: '\b(hall|entree|degagement|couloir|deg|hal|circulation|reduit|dressing|rangement|red|dre)\b', where: lot, code: SUP, type: Distribution}
      - {match: '\b(escaliers?|cage d.escalier|esc|cage)\b', code: SD, type: Escalier}
      - {match: '\b(ascenseurs?|asc|lift)\b', code: SD, type: Ascenseur}
      - {match: '\b(couloir|degagement|palier|hall|corridor|circulation|sas|deg|pal|hal|cir|entree)\b', where: commun, code: SD, type: CirculationH}
      - {match: '\b(gaines?|gtc|gt|gaine technique|shaft|vide)\b', code: SI, type: Gaine}
      - {match: '\b(local technique|technique|chaufferie|electricite|ventilation|sprinkler|tableau|cvse|ltc|lte|ltv|lts|tec|ven|ele|machinerie|sous-station)\b', code: SI, type: Local}
      - {match: '\b(caves?|cav|buanderie|bua|velos?|poussettes|depot|stock|stockage|abri|pc|garage|parking|stationnement|place de parc|voie de circulation|containers|dechets|sechoir|concierge|conciergerie|archives)\b', code: SUS, type: SUS}
      - {match: '\b(wc|toilettes?|sanitaires?|vestiaires?)\b', where: commun, code: SUS, type: SUS}
      - {match: '\b(commerce|arcade|magasin|boutique|restaurant|cafe|bureau|bureaux|administration|atelier|salle|cabinet|creche|uape|ecole)\b', where: commun, code: SUT, type: Commerce}
    default_types: {SUP: PieceDeVie, SUS: SUS, SD: CirculationH, SI: Local, SUT: Commerce}
    # code d'une pièce qui en fait autre chose qu'une pièce intérieure
    code_natures: {SEU: exterieur, SED: exterieur, SEI: exterieur, SEP: exterieur, SA: site, SP: plancher}
    # Extérieurs (phase 22). Un « plancher externe » est le contour d'un extérieur (SEP), pas une surface élémentaire :
    # Treegram n'a de SEP qu'en total de niveau. Les autres prennent SEU, SED ou SEI : propriété, catégorie, puis noms.
    exterior_floor: '(plancher externe|externe de plancher)'
    exterior_categories: {'externe utile': SEU, 'externe de degagement': SED, 'externe interieure?': SEI}
    exterior_rooms:
      - {match: '\b(balcons?|bal|loggias?|logg)\b', code: SEU, type: Balcon}
      - {match: '\b(terrasses?|ter|attique|jardins?|jar|toiture accessible)\b', where: lot, code: SEU, type: Terrasse}
      # entrées couvertes : SEU comme le MDP de La Bâtie (Treegram L'Orée : SED), choix du 28.10.2026
      - {match: '\b(entree|ent|porche|perron)\b', code: SEU, type: Terrasse}
      - {match: '\b(coursives?|passage|couvert|circulation|galerie|preau)\b', code: SED, type: CirculationExt}
      - {match: '\b(terrasses?|ter|toiture accessible)\b', code: SEU, type: Terrasse}
    exterior_default: {code: SEU, type: Terrasse}
    exterior_default_types: {SEU: Terrasse, SED: CirculationExt}
    # Conventions de Treegram, appliquées après les sources : dans un logement, un dégagement est de la SUP
    # « Distribution » (L'Orée : SD réservée aux circulations communes, escaliers et ascenseurs), et un réduit
    # ou un rangement classé SUS par l'architecte reste de la SUP (MDP Myonaz)
    treegram_conventions: true
  # SP par niveau (generation/interiors.py) : espaces « surface de plancher » s'il y en a, sinon contour des
  # pièces, murs et poteaux du niveau, joints fermés et petits vides bouchés
  sp:
    close_m: 0.3
    min_hole_m2: 4.0
    # aire d'une pièce : declared (quantités IFC, à défaut l'emprise) | plan (emprise, SIA 416 §0.4). Le MDP Myonaz
    # retient l'aire Revit, plus petite que l'emprise sous les toitures en pente (N03 : 164,7 m² de SUP, pas 182,6)
    area_source: declared
  # Codes de niveau Treegram (N00, N01…, S01…, Toiture) : le rez est le niveau dont le nom correspond au premier
  # motif trouvé ; les autres sont numérotés par altitude. Un niveau sans pièce au-dessus du dernier niveau
  # occupé, au nom de toiture, devient « Toiture ». Sans rez reconnu, les noms de la maquette sont gardés.
  levels:
    ground: ['^N00$', '(?i)^RDC\b', '^EG\b', '^E00\b', '(?i)^niveau\s*0\b', '^0+$', '(?i)rez']
    roof: '(?i)(toit|ttr|toiture|roof|dach)'
